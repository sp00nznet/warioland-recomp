name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libsdl2-dev
      # No ROM in CI: build the recompiler and check the setup scripts parse.
      - run: cmake -S gbrecomp -B gbrecomp/build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build gbrecomp/build --target gbrecomp
      - run: bash -n setup.sh
      - run: pwsh -NoProfile -Command '$null = [System.Management.Automation.Language.Parser]::ParseFile("tools/setup.ps1", [ref]$null, [ref]$e); if ($e) { $e; exit 1 }'
